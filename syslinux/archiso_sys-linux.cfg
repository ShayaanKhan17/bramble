SERIAL 0 115200

DEFAULT cachyos
TIMEOUT 150
PROMPT 1

MENU TITLE BrambleOS Live Boot Menu
MENU BACKGROUND splash.png
MENU COLOR Border       30;44   #00000000 #00000000 none
MENU COLOR Title        1;36;44 #ff0087af #00000000 none
MENU COLOR Sel          7;37;40 #ffffffff #ff007799 none
MENU COLOR Unsel        37;44   #ffdddddd #00000000 none
MENU COLOR Help         37;40   #ffdddddd #00000000 none

LABEL cachyos
TEXT HELP
Boot the BrambleOS install medium on BIOS.
ENDTEXT
MENU LABEL BrambleOS default (x86_64, BIOS)
LINUX /arch/boot/x86_64/vmlinuz-linux-cachyos
INITRD /arch/boot/x86_64/initramfs-linux-cachyos.img
APPEND archisobasedir=arch archisolabel=BRAMBLEOS cow_spacesize=10G copytoram=auto module_blacklist=pcspkr i915.modeset=1 amdgpu.modeset=1 nvme_load=yes

LABEL cachyosfallback
TEXT HELP
Boot the BrambleOS install medium on BIOS with safe graphics.
ENDTEXT
MENU LABEL BrambleOS Fallback (nomodeset, BIOS)
LINUX /arch/boot/x86_64/vmlinuz-linux-cachyos
INITRD /arch/boot/x86_64/initramfs-linux-cachyos.img
APPEND archisobasedir=arch archisolabel=BRAMBLEOS cow_spacesize=10G copytoram=auto module_blacklist=nvidia,nvidia_modeset,nvidia_uvm,nvidia_drm nomodeset nvme_load=yes

LABEL existing
MENU LABEL Boot existing OS
COM32 chain.c32
APPEND hd0 0

LABEL reboot
MENU LABEL Reboot
COM32 reboot.c32

LABEL poweroff
MENU LABEL Power Off
COM32 poweroff.c32